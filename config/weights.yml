# V1 để trọng số bằng nhau: hiện chưa có dữ liệu nào nói tín hiệu nào quan trọng
# hơn. Bảng Outcome (pha 2) sẽ trả lời câu đó. Đổi trọng số thì tăng version để
# so sánh được hai bộ trên cùng tập dữ liệu.
# v2: confidence nhân vào trọng số rồi mới chuẩn hoá, thay vì chỉ làm cổng chặn.
# Bump version vì cùng bộ số này giờ cho ra điểm khác — để lại v1 thì việc so
# sánh hai bộ trọng số trên cùng dữ liệu sẽ sai một cách âm thầm.
version: v2-confidence-weighted
minConfidence: 0.3
weights:
  audit_gap: 1
  freshness: 1
  competition: 1
  value_at_risk: 1
